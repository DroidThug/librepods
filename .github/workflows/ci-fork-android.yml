name: Fork Android build

on:
  push:
    branches:
      - fork-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" -Dkotlin.daemon.jvm.options="-Xmx3g,-XX:+UseParallelGC" -Dorg.gradle.workers.max=3'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Accept licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;30.0.14904198"
      - name: Build debug APK
        run: ./gradlew assembleFossDebug
        working-directory: android
      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: apk-foss-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
